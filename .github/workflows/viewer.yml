name: viewer

# Publishes viewer/ (only that folder) on GitHub Pages, so the robot opens in the browser without a download:
# https://morante-robotics.github.io/spider-bot-replica/
on:
  workflow_dispatch:          # run by hand from the Actions tab
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/viewer.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deployment
        uses: actions/deploy-pages@v4
