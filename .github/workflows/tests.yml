name: tests

# The shared tools (tools/) must keep catching every failure that once reached a print.
on:
  push:
    paths: ["tools/**", "pyproject.toml", "uv.lock", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["tools/**", "pyproject.toml", "uv.lock"]

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-default-groups --group dev
      - run: uv run --no-sync python -m pytest -q
